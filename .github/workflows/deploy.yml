name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - name: Migrate D1
        run: pnpm --filter @preppal/api db:migrate:remote
      - name: Deploy API
        run: pnpm --filter @preppal/api deploy
      - name: Deploy storefront
        run: pnpm --filter @preppal/web build && pnpm --filter @preppal/web deploy
      - name: Deploy admin
        run: pnpm --filter @preppal/admin build && pnpm --filter @preppal/admin deploy
